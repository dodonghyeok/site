<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모둠 & 발표자 랜덤 생성기</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a3a2a;
    min-height: 100vh;
    font-family: 'Nanum Gothic', 'Malgun Gothic', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px 60px;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(45,106,79,0.4) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(20,60,40,0.6) 0%, transparent 50%);
  }

  h1.site-title {
    font-family: 'Nanum Brush Script', cursive;
    color: rgba(240,234,214,0.85);
    font-size: clamp(26px, 5vw, 38px);
    text-align: center;
    margin-bottom: 28px;
    letter-spacing: 2px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
  }

  .board {
    background: #2d6a4f;
    border-radius: 16px;
    border: 10px solid #5c3d1e;
    box-shadow:
      inset 0 0 60px rgba(0,0,0,0.35),
      0 8px 40px rgba(0,0,0,0.5),
      0 0 0 2px rgba(100,70,30,0.4);
    padding: 28px;
    width: 100%;
    max-width: 640px;
  }

  /* chalk texture overlay */
  .board::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 8px;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.5;
  }

  .board-title {
    text-align: center;
    color: #f0ead6;
    font-size: clamp(16px, 3.5vw, 20px);
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 22px;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
    border-bottom: 2px dashed rgba(240,234,214,0.25);
    padding-bottom: 16px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    background: rgba(0,0,0,0.25);
    border: 1.5px solid rgba(240,234,214,0.2);
    border-radius: 8px;
    color: rgba(240,234,214,0.55);
    font-size: clamp(12px, 2.5vw, 14px);
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    font-family: inherit;
    letter-spacing: 0.5px;
  }
  .tab:hover { background: rgba(0,0,0,0.38); color: #f0ead6; }
  .tab.active {
    background: rgba(240,234,214,0.15);
    border-color: rgba(240,234,214,0.65);
    color: #f0ead6;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .section { display: none; }
  .section.active { display: block; }

  /* 명단 */
  .name-input-area {
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    border: 1px solid rgba(240,234,214,0.15);
    padding: 14px;
    margin-bottom: 12px;
  }
  .name-input-area label {
    color: rgba(240,234,214,0.75);
    font-size: 13px;
    display: block;
    margin-bottom: 9px;
    letter-spacing: 1px;
  }
  .add-row { display: flex; gap: 8px; }
  .chalk-input {
    flex: 1;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(240,234,214,0.3);
    border-radius: 6px;
    color: #f0ead6;
    font-size: 15px;
    padding: 9px 13px;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .chalk-input:focus { outline: none; border-color: rgba(240,234,214,0.75); }
  .chalk-input::placeholder { color: rgba(240,234,214,0.3); }
  .add-btn {
    background: rgba(240,234,214,0.15);
    border: 1px solid rgba(240,234,214,0.4);
    border-radius: 6px;
    color: #f0ead6;
    font-size: 20px;
    padding: 9px 16px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    line-height: 1;
  }
  .add-btn:hover { background: rgba(240,234,214,0.28); transform: scale(1.05); }
  .add-btn:active { transform: scale(0.95); }

  .count-badge {
    color: rgba(240,234,214,0.55);
    font-size: 12px;
    text-align: right;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .name-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    min-height: 44px;
    padding: 10px;
    background: rgba(0,0,0,0.15);
    border-radius: 7px;
    border: 1px solid rgba(240,234,214,0.12);
    margin-bottom: 14px;
    align-content: flex-start;
  }
  .name-tag {
    background: rgba(240,234,214,0.16);
    border: 1px solid rgba(240,234,214,0.32);
    color: #f0ead6;
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .name-tag:hover { background: rgba(200,50,50,0.32); border-color: rgba(220,100,100,0.5); }
  .name-tag .remove { color: rgba(240,234,214,0.45); font-size: 11px; }

  /* 버튼 */
  .chalk-btn {
    width: 100%;
    padding: 13px;
    background: rgba(240,234,214,0.1);
    border: 2px solid rgba(240,234,214,0.45);
    border-radius: 8px;
    color: #f0ead6;
    font-size: clamp(14px, 3vw, 16px);
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1.5px;
    transition: all 0.15s;
    margin-bottom: 10px;
    display: block;
  }
  .chalk-btn:hover { background: rgba(240,234,214,0.2); transform: scale(1.01); }
  .chalk-btn:active { transform: scale(0.97); }
  .chalk-btn.go { background: rgba(60,160,100,0.3); border-color: rgba(120,210,150,0.65); }
  .chalk-btn.go:hover { background: rgba(60,160,100,0.45); }
  .chalk-btn.spin { background: rgba(200,140,40,0.28); border-color: rgba(240,190,70,0.6); }
  .chalk-btn.spin:hover { background: rgba(200,140,40,0.42); }
  .chalk-btn.danger { background: rgba(180,50,50,0.2); border-color: rgba(220,100,100,0.4); }
  .chalk-btn.danger:hover { background: rgba(180,50,50,0.35); }

  /* 모둠 설정 */
  .setting-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .setting-row label { color: rgba(240,234,214,0.82); font-size: 14px; min-width: 75px; }
  .chalk-select {
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(240,234,214,0.35);
    border-radius: 6px;
    color: #f0ead6;
    font-size: 14px;
    padding: 8px 13px;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .chalk-select:focus { outline: none; border-color: rgba(240,234,214,0.7); }
  .chalk-select option { background: #1a4a35; color: #f0ead6; }
  .setting-unit { color: rgba(240,234,214,0.65); font-size: 14px; }

  /* 모둠 결과 */
  .result-area {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .group-card {
    background: rgba(0,0,0,0.2);
    border: 1.5px dashed rgba(240,234,214,0.38);
    border-radius: 10px;
    padding: 12px 16px;
    min-width: 110px;
    flex: 1;
    animation: popIn 0.3s ease both;
  }
  .group-card .group-title {
    color: rgba(240,234,214,0.6);
    font-size: 12px;
    margin-bottom: 8px;
    letter-spacing: 2px;
    font-weight: 700;
  }
  .group-card .member {
    color: #f0ead6;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.9;
  }
  @keyframes popIn {
    from { opacity:0; transform: scale(0.82) translateY(6px); }
    to   { opacity:1; transform: scale(1) translateY(0); }
  }

  /* 발표자 뽑기 */
  .spinner-display {
    text-align: center;
    background: rgba(0,0,0,0.25);
    border-radius: 10px;
    border: 2px solid rgba(240,234,214,0.18);
    padding: 32px 20px;
    margin-bottom: 14px;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spinner-name {
    color: #f0ead6;
    font-size: clamp(24px, 6vw, 34px);
    font-weight: 800;
    letter-spacing: 4px;
    text-shadow: 0 0 12px rgba(255,255,180,0.28);
  }
  .spinner-hint { color: rgba(240,234,214,0.38); font-size: 15px; }
  .pick-history { margin-top: 10px; }
  .pick-history-label {
    color: rgba(240,234,214,0.4);
    font-size: 12px;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }
  .pick-history-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .pick-hist-tag {
    background: rgba(0,0,0,0.2);
    border-radius: 20px;
    padding: 4px 11px;
    font-size: 13px;
    color: rgba(240,234,214,0.7);
  }

  /* 팝업 */
  .popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 999;
    align-items: center;
    justify-content: center;
  }
  .popup-overlay.show { display: flex; }
  .popup-card {
    background: #2d6a4f;
    border: 8px solid #5c3d1e;
    border-radius: 20px;
    padding: clamp(28px, 6vw, 50px) clamp(32px, 8vw, 64px);
    text-align: center;
    animation: zoomIn 0.42s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 24px 80px rgba(0,0,0,0.65), inset 0 0 40px rgba(0,0,0,0.2);
    max-width: 90vw;
  }
  @keyframes zoomIn {
    from { opacity:0; transform: scale(0.35) rotate(-6deg); }
    to   { opacity:1; transform: scale(1) rotate(0); }
  }
  .popup-emoji { font-size: clamp(32px, 8vw, 50px); display: block; margin-bottom: 10px; }
  .popup-label {
    color: rgba(240,234,214,0.65);
    font-size: 14px;
    letter-spacing: 3px;
    margin-bottom: 10px;
  }
  .popup-winner {
    color: #fff;
    font-size: clamp(30px, 8vw, 46px);
    font-weight: 800;
    letter-spacing: 5px;
    text-shadow: 0 0 24px rgba(255,255,180,0.55), 0 2px 5px rgba(0,0,0,0.5);
    margin-bottom: 28px;
    font-family: 'Nanum Brush Script', cursive;
  }
  .popup-close {
    background: rgba(240,234,214,0.14);
    border: 2px solid rgba(240,234,214,0.5);
    border-radius: 8px;
    color: #f0ead6;
    font-size: 15px;
    font-weight: 700;
    padding: 11px 32px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1.5px;
    transition: all 0.15s;
  }
  .popup-close:hover { background: rgba(240,234,214,0.26); transform: scale(1.03); }

  /* 색종이 */
  .confetti-piece {
    position: fixed;
    border-radius: 3px;
    pointer-events: none;
    z-index: 1200;
    animation: confettiFall 1.5s ease-out forwards;
  }
  @keyframes confettiFall {
    0%   { opacity:1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity:0; transform: translateY(400px) rotate(780deg) scale(0.6); }
  }

  /* 하단 크레딧 */
  .footer {
    margin-top: 24px;
    color: rgba(200,230,210,0.35);
    font-size: 12px;
    text-align: center;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<h1 class="site-title">📋 모둠 &amp; 발표자 랜덤 생성기</h1>

<div class="board">
  <div class="board-title">✏️ 선생님을 위한 학급 경영 도구</div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('list')">📋 학생 명단</button>
    <button class="tab" onclick="switchTab('group')">👥 모둠 짜기</button>
    <button class="tab" onclick="switchTab('pick')">🎯 발표자 뽑기</button>
  </div>

  <!-- 학생 명단 -->
  <div class="section active" id="tab-list">
    <div class="name-input-area">
      <label>이름 추가 (한 명씩 또는 쉼표로 여러 명)</label>
      <div class="add-row">
        <input class="chalk-input" id="newName" placeholder="예) 김민준, 이서연..." onkeydown="if(event.key==='Enter')addName()">
        <button class="add-btn" onclick="addName()" title="추가">＋</button>
      </div>
    </div>
    <div class="count-badge" id="countBadge">학생 0명 등록됨</div>
    <div class="name-tags" id="nameTags"></div>
    <button class="chalk-btn" onclick="loadSample()">📝 예시 명단 불러오기 (15명)</button>
    <button class="chalk-btn danger" onclick="clearAll()">🗑 전체 삭제</button>
  </div>

  <!-- 모둠 짜기 -->
  <div class="section" id="tab-group">
    <div class="setting-row">
      <label>모둠 방식</label>
      <select class="chalk-select" id="groupMode" onchange="updateGroupMode()">
        <option value="bySize">인원 수로 나누기</option>
        <option value="byCount">모둠 수로 나누기</option>
      </select>
    </div>
    <div class="setting-row" id="rowBySize">
      <label>한 모둠에</label>
      <select class="chalk-select" id="groupSize">
        <option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option>
      </select>
      <span class="setting-unit">명씩</span>
    </div>
    <div class="setting-row" id="rowByCount" style="display:none;">
      <label>모둠 수</label>
      <select class="chalk-select" id="groupCount">
        <option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option>
      </select>
      <span class="setting-unit">모둠으로</span>
    </div>
    <button class="chalk-btn go" id="groupBtn" onclick="makeGroups()">⚡ 모둠 나누기!</button>
    <div class="result-area" id="groupResult"></div>
  </div>

  <!-- 발표자 뽑기 -->
  <div class="section" id="tab-pick">
    <div class="spinner-display">
      <div id="spinnerName" class="spinner-hint">버튼을 눌러 발표자를 뽑으세요!</div>
    </div>
    <button class="chalk-btn spin" id="spinBtn" onclick="startSpin()">🎲 발표자 뽑기!</button>
    <div class="pick-history" id="pickHistoryBox" style="display:none;">
      <div class="pick-history-label">최근 발표자</div>
      <div class="pick-history-tags" id="pickHistoryTags"></div>
    </div>
  </div>
</div>

<div class="footer">클릭으로 이름 삭제 · 새로고침하면 초기화됩니다</div>

<!-- 팝업 -->
<div class="popup-overlay" id="popup">
  <div class="popup-card">
    <span class="popup-emoji">🎉</span>
    <div class="popup-label">오늘의 발표자는...</div>
    <div class="popup-winner" id="popupName"></div>
    <button class="popup-close" onclick="closePopup()">✔ 확인!</button>
  </div>
</div>

<script>
let students = [];
let isSpinning = false;
let pickHistory = [];
const SAMPLE = ['김민준','이서연','박지호','최수아','정민서','강도현','윤하은','임준혁','한채원','오태양','신예린','류동현','문지우','배소율','장현우'];

function renderTags() {
  const container = document.getElementById('nameTags');
  const badge = document.getElementById('countBadge');
  container.innerHTML = students.map((s,i) =>
    `<div class="name-tag" title="클릭하여 삭제" onclick="removeName(${i})">${s} <span class="remove">✕</span></div>`
  ).join('') || '<span style="color:rgba(240,234,214,0.25);font-size:13px;padding:4px;">아직 등록된 학생이 없습니다</span>';
  badge.textContent = `학생 ${students.length}명 등록됨`;
}

function addName() {
  const inp = document.getElementById('newName');
  const v = inp.value.trim();
  if (!v) return;
  const names = v.split(/[,，\s]+/).map(n=>n.trim()).filter(n=>n.length>0);
  names.forEach(n => { if (!students.includes(n)) students.push(n); });
  inp.value = '';
  renderTags();
  inp.focus();
}

function removeName(i) {
  students.splice(i,1);
  renderTags();
}

function clearAll() {
  if (students.length > 0 && confirm('전체 명단을 삭제할까요?')) {
    students = [];
    renderTags();
  }
}

function loadSample() {
  students = [...SAMPLE];
  renderTags();
}

function switchTab(name) {
  const names = ['list','group','pick'];
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', names[i]===name));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
}

function updateGroupMode() {
  const mode = document.getElementById('groupMode').value;
  document.getElementById('rowBySize').style.display = mode==='bySize' ? 'flex' : 'none';
  document.getElementById('rowByCount').style.display = mode==='byCount' ? 'flex' : 'none';
}

function makeGroups() {
  if (students.length < 2) { alert('학생 명단을 2명 이상 등록해주세요!'); switchTab('list'); return; }
  const shuffled = [...students].sort(()=>Math.random()-0.5);
  const mode = document.getElementById('groupMode').value;
  let size;
  if (mode === 'bySize') {
    size = parseInt(document.getElementById('groupSize').value);
  } else {
    const count = parseInt(document.getElementById('groupCount').value);
    size = Math.ceil(shuffled.length / count);
  }
  const groups = [];
  for (let i=0; i<shuffled.length; i+=size) groups.push(shuffled.slice(i,i+size));
  const result = document.getElementById('groupResult');
  result.innerHTML = '';
  groups.forEach((g,i) => {
    const card = document.createElement('div');
    card.className = 'group-card';
    card.style.animationDelay = (i*0.07)+'s';
    card.innerHTML = `<div class="group-title">${i+1}모둠</div><div class="member">${g.join('<br>')}</div>`;
    result.appendChild(card);
  });
  document.getElementById('groupBtn').textContent = '🔄 다시 나누기';
}

function startSpin() {
  if (students.length < 1) { alert('학생 명단을 먼저 등록해주세요!'); switchTab('list'); return; }
  if (isSpinning) return;
  isSpinning = true;
  const btn = document.getElementById('spinBtn');
  btn.disabled = true; btn.style.opacity = '0.6';
  const display = document.getElementById('spinnerName');
  display.className = 'spinner-name';
  let count = 0;
  const maxCount = 28 + Math.floor(Math.random()*16);
  function tick() {
    if (!isSpinning) return;
    const r = students[Math.floor(Math.random()*students.length)];
    display.textContent = r;
    count++;
    if (count >= maxCount) {
      const winner = students[Math.floor(Math.random()*students.length)];
      display.textContent = winner;
      setTimeout(() => showWinner(winner), 380);
    } else {
      const delay = count < 10 ? 55 : count < 20 ? 80 : 120;
      setTimeout(tick, delay);
    }
  }
  tick();
}

function showWinner(name) {
  document.getElementById('popupName').textContent = name;
  document.getElementById('popup').classList.add('show');
  launchConfetti();
  pickHistory.unshift(name);
  if (pickHistory.length > 6) pickHistory.pop();
  const box = document.getElementById('pickHistoryBox');
  const tags = document.getElementById('pickHistoryTags');
  box.style.display = 'block';
  tags.innerHTML = pickHistory.map((n,i) =>
    `<span class="pick-hist-tag" style="opacity:${1-i*0.14}">${n}</span>`
  ).join('');
}

function closePopup() {
  document.getElementById('popup').classList.remove('show');
  isSpinning = false;
  const btn = document.getElementById('spinBtn');
  btn.disabled = false; btn.style.opacity = '1';
  btn.textContent = '🎲 한 번 더 뽑기!';
}

function launchConfetti() {
  const colors = ['#f9c74f','#90be6d','#f8961e','#f94144','#4cc9f0','#ffffff','#c77dff','#ffb347'];
  for (let i=0; i<60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    const size = 6 + Math.random()*9;
    c.style.cssText = `
      left:${15+Math.random()*70}%;top:${5+Math.random()*35}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-delay:${Math.random()*0.6}s;
      animation-duration:${1.1+Math.random()*0.9}s;
      width:${size}px;height:${size}px;
      transform:rotate(${Math.random()*360}deg);
    `;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 2800);
  }
}

document.getElementById('popup').addEventListener('click', e => {
  if (e.target === document.getElementById('popup')) closePopup();
});

renderTags();
</script>
</body>
</html>
